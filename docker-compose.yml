services:
  eve-trading-desk:
    build:
      context: .
      dockerfile: Dockerfile
    image: eve-trading-desk:latest
    container_name: eve-trading-desk
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-include "*.py"
      --reload-include "*.html"
      --reload-exclude "data/*"
      --reload-exclude "ledgers/*"
      --reload-exclude "tests/*"
      --reload-exclude "*.duckdb*"
      --reload-exclude "*.json"
      --reload-exclude "*.csv"
    volumes:
      - ./data:/app/data
      - ./ledgers:/app/ledgers
      - ./templates:/app/templates
      - ./static:/app/static
      - ./services:/app/services
      - ./workflows:/app/workflows
      - ./routers:/app/routers
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./.git:/app/.git:ro
      - ./app.py:/app/app.py
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - EVE_CLIENT_ID=c06167a9a9af4ce79e7f9aacda9eeee2
      - EVE_CLIENT_SECRET=${EVE_CLIENT_SECRET}
      - EVE_CALLBACK_URL=http://localhost:8000/sso/callback
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=https://github.com/ad-cooper/eve-trader
